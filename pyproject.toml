[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geosmie"
version = "2.2.0"
description = "Aerosol optical property lookup table generator for GEOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "GEOS-ESM Developers"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "netCDF4>=1.6",
    "xarray>=2023.1.0",
    "dask[array]>=2023.1.0",
    "numba>=0.57",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["geosmie", "Shared.api.geosmie", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--verbose"
filterwarnings = [
    "ignore::RuntimeWarning:numpy.ndarray",
]
